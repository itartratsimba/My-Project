<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion</title>
  <link rel="stylesheet" href="style.css">
  <script defer>
    async function sendLogin(form) {
      const erreur = document.getElementById("erreur");
      erreur.textContent = "";

      try {
        const response = await fetch("login.php", {
          method: "POST",
          body: new FormData(form)
        });
        // Le serveur répond en JSON, y compris pour l'erreur 401
        const data = await response.json();

        if (data.ok) {
          window.location.href = "index.html";
        } else {
          erreur.textContent = data.message;
        }
      } catch (error) {
        erreur.textContent = "Oups ! Quelque chose s'est mal passé : " + error.message;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("loginForm");
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        sendLogin(form);
      });
    });
  </script>
</head>
<body>
  <main class="carte">
    <h1>Connexion</h1>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="pwd">Mot de passe</label>
      <input id="pwd" name="pwd" type="password" required>

      <p id="erreur" class="erreur"></p>
      <button type="submit">Se connecter</button>
    </form>
    <p class="aide">Test : rasoa@mail.com / 1234</p>
  </main>
</body>
</html>
